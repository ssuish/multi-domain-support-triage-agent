services:
  triage-ui:
    build: .
    image: support-triage:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    volumes:
      - triage-runs:/app/runs

  triage-batch:
    image: support-triage:latest
    profiles: ["batch"]
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    volumes:
      - triage-runs:/app/runs
      - ./support_tickets:/app/support_tickets
    command: ["python", "code/main.py"]

volumes:
  triage-runs:
